build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInClasses: 15

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  # @Preview composables are entry points for tooling, not dead code.
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"]

naming:
  # Composables are conventionally PascalCase, unlike regular functions.
  FunctionNaming:
    ignoreAnnotated: ["Composable"]

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
